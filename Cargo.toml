[package]
name = "neural-network"
version = "0.1.0"
edition = "2024"

[dependencies]
derive_more = { version= "2", features = ["from", "display"] }
prost = "0.14.3"
prost-types = "0.14.3"

[build-dependencies]
prost-build = "0.14.3"

[dev-dependencies]
criterion = "0.8.2"
arrow-array = "57.3.0"
parquet = "57.3.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[[bench]]
name = "mnist_classifier"
harness = false

[[bench]]
name = "mnist_accuracy"
harness = false
