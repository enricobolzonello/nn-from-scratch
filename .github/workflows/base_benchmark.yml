on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  schedule:
    # Run once a month (random values for minute, hour, day; any month or day)
    - cron: "3 1 4 * *"
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

jobs:
  benchmark_base_branch:
    # Run only on the upstream repository.
    if: github.repository == 'enricobolzonello/nn-from-scratch'
    name: Continuous Benchmarking with Bencher
    permissions:
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: arduino/setup-protoc@v3
      - uses: actions/checkout@v6
      - run: rustup override set nightly
      - uses: bencherdev/bencher@main
      - name: Track latency benchmarks with Bencher
        run: |
          bencher run \
          --project neural-network \
          --token '${{ secrets.BENCHER_API_TOKEN }}' \
          --branch main \
          --testbed ubuntu-latest \
          --threshold-measure latency \
          --threshold-test t_test \
          --threshold-upper-boundary 0.99 \
          --thresholds-reset \
          --err \
          --adapter rust_criterion \
          --github-actions '${{ secrets.GITHUB_TOKEN }}' \
          "cargo bench --bench mnist_classifier"
      - name: Track accuracy with Bencher
        run: |
          bencher run \
          --project neural-network \
          --token '${{ secrets.BENCHER_API_TOKEN }}' \
          --branch main \
          --testbed ubuntu-latest \
          --threshold-measure accuracy \
          --threshold-test static \
          --threshold-lower-boundary 93.0 \
          --thresholds-reset \
          --err \
          --adapter json \
          --github-actions '${{ secrets.GITHUB_TOKEN }}' \
          "cargo bench --bench mnist_accuracy"
